<div class="wrap">
  <div class="card">
    <div class="brand">
      <div class="logo">حلاقي</div>
      <h1>حلاقي</h1>
      <div class="tagline">محلك في يدك</div>

      <div class="demo" *ngIf="true">
        <b>الدخول للمصرح لهم فقط</b><br>
        الحسابات يُنشئها مالك المنصة — لا يوجد تسجيل عام.
      </div>
    </div>

    <form (ngSubmit)="submit()">
      <div class="field">
        <label>البريد الإلكتروني</label>
        <input class="input" type="email" [(ngModel)]="email" name="email" placeholder="name&#64;example.com" autocomplete="email" dir="ltr">
      </div>

      <div class="field">
        <label>كلمة المرور</label>
        <div class="password-wrap">
          <input class="input" [type]="showPassword() ? 'text' : 'password'" [(ngModel)]="password" name="password"
                 placeholder="••••••••" autocomplete="current-password" dir="ltr">
          <button type="button" class="toggle" (click)="showPassword.set(!showPassword())"
                  [attr.aria-label]="showPassword() ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور'">
            <app-icon name="eye" [size]="19"></app-icon>
          </button>
        </div>
      </div>

      <div class="field-error"></div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" [disabled]="loading()">
        <span class="spinner" *ngIf="loading()"></span>
        <span>{{ loading() ? 'جارٍ الدخول…' : 'تسجيل الدخول' }}</span>
      </button>
    </form>
  </div>
</div>
