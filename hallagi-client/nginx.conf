# Static SPA + reverse proxy to the API (same origin: no CORS needed for the web app).
# Security headers live in security.inc (generated at start-up, see docker/40-runtime-config.sh);
# nginx does not inherit add_header into locations that declare their own, so each includes it.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 5m;
    }

    location /health/ {
        proxy_pass http://api:8080;
        access_log off;
    }

    # Content-hashed bundles never change: cache for a year
    location ~* "-[A-Z0-9]{8}\.(?:js|css)$" {
        include /etc/nginx/conf.d/security.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Deployment-specific or update-sensitive files: always revalidate
    location ~* ^/(?:config\.json|manifest\.webmanifest|ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js)$ {
        include /etc/nginx/conf.d/security.inc;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Icons, fonts, media: a day
    location ~* \.(?:png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        include /etc/nginx/conf.d/security.inc;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # SPA routes (including /book/:slug) fall back to index.html — never cached
    location / {
        include /etc/nginx/conf.d/security.inc;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
