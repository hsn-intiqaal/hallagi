name: Release

# Tag a version to publish it:  git tag v1.2.0 && git push origin v1.2.0
# - Docker images: ghcr.io/<owner>/hallagi-api:<version> and hallagi-web:<version> (+ latest)
# - Android: release APK/AAB attached to the GitHub release
#   (signed when the ANDROID_KEYSTORE_BASE64 / _PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD secrets exist)
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  images:
    name: Docker images → GHCR
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: hallagi-api
            context: .
            file: src/Hallagi.Api/Dockerfile
          - name: hallagi-web
            context: hallagi-client
            file: hallagi-client/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  android:
    name: Android release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hallagi-client
    env:
      VERSION_NAME: ${{ github.ref_name }}
      VERSION_CODE: ${{ github.run_number }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hallagi-client/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: Point the app at the production API
        if: ${{ vars.MOBILE_API_URL != '' }}
        run: |
          node -e "const f='public/config.json',c=require('./'+f);c.apiUrl=process.env.MOBILE_API_URL;require('fs').writeFileSync(f,JSON.stringify(c,null,2)+'\n')"
        env:
          MOBILE_API_URL: ${{ vars.MOBILE_API_URL }}
      - run: npm run build:mobile
      - name: Decode signing key
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APK + AAB
        working-directory: hallagi-client/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            hallagi-client/android/app/build/outputs/apk/release/*.apk
            hallagi-client/android/app/build/outputs/bundle/release/*.aab
