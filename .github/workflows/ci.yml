name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Hallagi.slnx
      - run: dotnet build Hallagi.slnx -c Release --no-restore
      - run: dotnet test Hallagi.slnx -c Release --no-build --logger "trx" --results-directory test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: test-results

  frontend:
    name: Frontend — production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hallagi-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hallagi-client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Unit tests
        run: npm run test:ci
      - run: npx ng build --configuration production
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: hallagi-client/dist/hallagi-client/browser
          retention-days: 7

  android:
    name: Android — debug APK
    runs-on: ubuntu-latest
    needs: [frontend]
    defaults:
      run:
        working-directory: hallagi-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hallagi-client/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: hallagi-client/dist/hallagi-client/browser
      - run: npx cap sync android
      - name: Assemble debug APK
        working-directory: hallagi-client/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: hallagi-debug-apk
          path: hallagi-client/android/app/build/outputs/apk/debug/*.apk

  e2e:
    name: End-to-end (Playwright, SQLite demo)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hallagi-client/package-lock.json
      - name: Start API (SQLite demo data)
        run: |
          ASPNETCORE_ENVIRONMENT=Development Database__Provider=Sqlite \
          ConnectionStrings__Default="Data Source=${{ runner.temp }}/hallagi.db" \
          nohup dotnet run --project src/Hallagi.Api --no-launch-profile --urls http://localhost:5095 > api.log 2>&1 &
      - name: Start web
        working-directory: hallagi-client
        run: |
          npm ci
          npx playwright install --with-deps chromium
          nohup npx ng serve --port 4300 > ../web.log 2>&1 &
      - name: Wait for services
        run: |
          for i in $(seq 1 90); do
            curl -sf http://localhost:5095/health/ready && curl -sf http://localhost:4300 >/dev/null && exit 0
            sleep 2
          done
          cat api.log web.log; exit 1
      - name: Playwright
        working-directory: hallagi-client
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-artifacts
          path: |
            hallagi-client/test-results
            api.log
            web.log
